services:
  # Baza danych dla WordPressa
  comzezarl-db:
    image: mariadb:11
    container_name: comzezarl-db
    restart: unless-stopped

    # Zmienne środowiskowe wczytywane z pliku .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    # Wolumen z danymi bazy danych
    # Dzięki temu baza nie znika po usunięciu kontenera
    volumes:
      - comzezarl_db_data:/var/lib/mysql

    # Prywatna sieć projektu
    networks:
      - comzezarl_net

  # Aplikacja WordPress
  comzezarl-wp:
    image: wordpress:php8.3-apache
    container_name: comzezarl-wp
    restart: unless-stopped

    # Dane połączenia WordPressa z bazą danych
    environment:
      WORDPRESS_DB_HOST: comzezarl-db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}

    # WordPress startuje po bazie danych
    depends_on:
      - comzezarl-db

    # Wolumen z plikami WordPressa
    # Bind mount z konfiguracją PHP zwiększającą limit uploadu
    volumes:
      - comzezarl_wp_data:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

    networks:
      - comzezarl_net

  # Reverse Proxy
  comzezarl-nginx:
    image: nginx:stable-alpine
    container_name: comzezarl-nginx
    restart: unless-stopped

    depends_on:
      - comzezarl-wp

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d:/etc/nginx/custom-conf.d:ro
      - ./nginx/logs:/var/log/nginx

    networks:
      - comzezarl_net

  # Narzędzie administracyjne WordPress (WP-CLI)
  # Uruchamiane tylko na żądanie, np. do search-replace
  wpcli:
    image: wordpress:cli
    container_name: comzezarl-wpcli

    profiles:
      - tools

    depends_on:
      - comzezarl-db

    environment:
      WORDPRESS_DB_HOST: comzezarl-db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}

    volumes:
      - comzezarl_wp_data:/var/www/html

    working_dir: /var/www/html

    networks:
      - comzezarl_net

# Named volumes zarządzane przez Dockera
volumes:
  comzezarl_db_data:
  comzezarl_wp_data:

# Prywatna sieć kontenerów
networks:
  comzezarl_net:
    driver: bridge

